name: lint

on:
  pull_request:

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes prettier --check --prose-wrap=never 'plugins/**/*.md'
      - run: npx --yes markdownlint-cli2 'plugins/**/*.md'
